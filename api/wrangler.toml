name = "promptpack-api"
main = "src/index.ts"
compatibility_date = "2024-01-01"
account_id = "5d400bdfa16d6cb8aceff86d50d43650"
workers_dev = false
preview_urls = false

routes = [
  { pattern = "api.skillset.so", zone_name = "skillset.so", custom_domain = true },
  { pattern = "grok.skillset.so", zone_name = "skillset.so", custom_domain = true },
  # Legacy pmtpk.com routes kept active during dual-run for existing desktop app installs.
  # Remove after Plausible/Worker analytics show ~zero pmtpk.com traffic (T+6-12 months).
  { pattern = "api.pmtpk.com", zone_name = "pmtpk.com", custom_domain = true },
  { pattern = "grok.pmtpk.com", zone_name = "pmtpk.com", custom_domain = true }
]

[vars]
ENVIRONMENT = "production"
CONVEX_URL = "https://determined-lark-313.convex.site"
ALLOWED_ORIGINS = "https://skillset.so, https://www.skillset.so, https://pmtpk.com, https://www.pmtpk.com"
# OLLAMA_URL canonical; ollama.pmtpk.com DNS-aliased to same backend during dual-run.
OLLAMA_URL = "https://ollama.skillset.so"
# Clerk retired — all users migrated to BetterAuth. Worker validates
# BetterAuth RS256 JWTs (issuer/JWKS via BETTER_AUTH_* env vars).

# R2 bucket binding (production)
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "promptpack-files-prod"

# Required secrets (set via `wrangler secret put`, not in this file):
#   OPENROUTER_API_KEY        — used by /api/llm/chat managed-mode proxy
#   SKILLSET_INTERNAL_KEY     — shared secret with Convex /api/internal/credits/* endpoints
#   GROQ_API_KEY              — used by /api/enhance and /api/evaluate
#   BETTER_AUTH_ISSUER        — BetterAuth JWT issuer (e.g. https://skillset.so)
#   BETTER_AUTH_JWKS_URL      — BetterAuth JWKS endpoint (optional, derived from issuer)
#   BETTER_AUTH_AUDIENCE      — BetterAuth JWT audience claim (optional)
