<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Skillset · OG card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0c;
    --brand: #2b6bff;
    --brand-2: #4f86ff;
    --brand-soft: #aac7ff;
    --pink: #ff7ab6;
    --zinc-50: #fafafa;
    --zinc-200: #e4e4e7;
    --zinc-300: #d4d4d8;
    --zinc-400: #a1a1aa;
    --zinc-500: #71717a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: #18181b;
    font-family: 'Geist', system-ui, -apple-system, sans-serif;
    color: var(--zinc-100);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow: hidden;
  }

  .stage {
    width: 100vw; height: 100vh;
    display: grid; place-items: center;
  }
  .scaler {
    width: 1200px; height: 630px;
    transform: scale(min(1, calc((100vw - 48px) / 1200), calc((100vh - 48px) / 630)));
    transform-origin: center center;
  }
  .mono { font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }

  .post {
    width: 1200px; height: 630px;
    background: var(--bg);
    position: relative;
    overflow: hidden;
    display: grid;
    grid-template-columns: 1.35fr 1fr;
    color: var(--zinc-50);
  }

  .post::before {
    content: ""; position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 65% 75% at 80% 50%, rgba(43,107,255,0.30), transparent 62%),
      radial-gradient(ellipse 50% 55% at 8% 12%, rgba(79,134,255,0.18), transparent 60%),
      radial-gradient(ellipse 45% 50% at 10% 110%, rgba(255,122,182,0.10), transparent 60%);
    z-index: 0; pointer-events: none;
  }
  .post::after {
    content: ""; position: absolute; inset: 0; z-index: 1;
    opacity: 0.05; mix-blend-mode: overlay; pointer-events: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.55'/></svg>");
  }

  /* ---------- Left column ---------- */
  .left {
    position: relative; z-index: 2;
    padding: 56px 0 56px 64px;
    display: flex; flex-direction: column;
    justify-content: space-between;
  }

  .brand {
    display: flex; align-items: center; gap: 14px;
    font-size: 28px; font-weight: 600; letter-spacing: -0.025em;
    color: var(--zinc-50);
  }
  .brand-logo { height: 42px; width: auto; display: block; }

  .heading {
    display: flex; flex-direction: column; gap: 22px;
  }
  h1 {
    font-size: 72px; line-height: 1.0; letter-spacing: -0.04em;
    font-weight: 600; color: var(--zinc-50);
  }
  h1 .grad {
    background: linear-gradient(135deg, #4f86ff 0%, #aac7ff 55%, #ff7ab6 130%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .sub {
    font-size: 22px; line-height: 1.4; letter-spacing: -0.01em;
    color: var(--zinc-300); max-width: 600px;
  }
  .sub b { color: var(--zinc-50); font-weight: 600; }

  .channels {
    display: flex; align-items: center; gap: 14px;
    color: var(--zinc-400); font-size: 15px; letter-spacing: 0.04em;
    text-transform: uppercase; font-weight: 500;
  }
  .channels .pip { width: 5px; height: 5px; border-radius: 50%; background: var(--zinc-500); opacity: 0.55; }
  .channels b { color: var(--zinc-200); font-weight: 600; }

  .foot {
    display: flex; align-items: center; justify-content: space-between;
    color: var(--zinc-500);
    font-size: 16px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 500;
  }
  .foot .url { color: var(--zinc-200); }

  /* ---------- Right column: Skilly ---------- */
  .right {
    position: relative; z-index: 2;
    display: grid; place-items: center;
  }
  .mascot-wrap {
    position: relative; width: 420px; height: 420px;
    display: grid; place-items: center;
  }
  .halo {
    position: absolute; width: 460px; height: 460px; border-radius: 50%;
    background: radial-gradient(circle, rgba(43,107,255,0.55) 0%, rgba(43,107,255,0.14) 42%, transparent 70%);
    filter: blur(6px);
  }
  .ring {
    position: absolute; width: 392px; height: 392px; border-radius: 50%;
    border: 1.5px dashed rgba(170,199,255,0.28);
  }
  .mascot {
    position: relative; z-index: 3;
    width: 300px; height: 325px;
    filter: drop-shadow(0 22px 42px rgba(13,38,107,0.55));
  }
  .spark { position: absolute; z-index: 4; }
  .spark.s1 { top: 40px;  left: 18px;  }
  .spark.s2 { top: 26px;  right: 24px; }
  .spark.s3 { bottom: 70px; left: 12px; }
  .spark.s4 { bottom: 48px; right: 14px; }
</style>
</head>
<body>
  <div class="stage"><div class="scaler">
  <article class="post">

    <div class="left">
      <div class="brand">
        <img src="web/public/img/skillset_logo.png" alt="" class="brand-logo" />
        <span>Skillset</span>
      </div>

      <div class="heading">
        <h1>Replace <span class="grad">Claude &amp; Codex.</span><br/>Keep your tokens.</h1>
        <p class="sub">Use <b>Skillset</b> instead of separate AI subscriptions. It auto-routes every task to the cheapest capable model and cuts your token spend up to <b>80%</b>.</p>

        <div class="channels mono">
          <b>ChatGPT</b><span class="pip"></span>
          <b>Claude</b><span class="pip"></span>
          <b>Gemini</b><span class="pip"></span>
          <b>Telegram</b>
        </div>
      </div>

      <div class="foot">
        <span class="mono">3-day free trial · cancel anytime</span>
        <span class="mono url">skillset.so</span>
      </div>
    </div>

    <div class="right">
      <div class="mascot-wrap">
        <div class="halo"></div>
        <div class="ring"></div>

        <div class="spark s1"><svg width="30" height="30" viewBox="0 0 24 24" fill="#f5c451"><path d="M12 0c.6 5.4 2.2 7 7.6 7.6-5.4.6-7 2.2-7.6 7.6-.6-5.4-2.2-7-7.6-7.6C9.8 7 11.4 5.4 12 0z"/></svg></div>
        <div class="spark s2"><svg width="20" height="20" viewBox="0 0 24 24" fill="#aac7ff"><path d="M12 0c.6 5.4 2.2 7 7.6 7.6-5.4.6-7 2.2-7.6 7.6-.6-5.4-2.2-7-7.6-7.6C9.8 7 11.4 5.4 12 0z"/></svg></div>
        <div class="spark s3"><svg width="24" height="24" viewBox="0 0 24 24" fill="#ff7ab6"><path d="M12 21s-7-4.5-9.5-9A5.5 5.5 0 0 1 12 6a5.5 5.5 0 0 1 9.5 6C19 16.5 12 21 12 21z"/></svg></div>
        <div class="spark s4"><svg width="26" height="26" viewBox="0 0 24 24" fill="#f5c451"><path d="M12 0c.6 5.4 2.2 7 7.6 7.6-5.4.6-7 2.2-7.6 7.6-.6-5.4-2.2-7-7.6-7.6C9.8 7 11.4 5.4 12 0z"/></svg></div>

        <svg class="mascot" viewBox="0 0 120 130" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="faceShine" cx="32%" cy="28%" r="55%">
              <stop offset="0%"  stop-color="white" stop-opacity="0.55"/>
              <stop offset="100%" stop-color="white" stop-opacity="0"/>
            </radialGradient>
            <filter id="wonky2" x="-15%" y="-15%" width="130%" height="130%">
              <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="4" result="noise"/>
              <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5"/>
            </filter>
          </defs>
          <g stroke-linejoin="round" stroke-linecap="round">
            <polygon points="58,14 78,56 106,42 88,76 98,108 58,86 18,112 30,78 10,50 40,50"
                     fill="#0d266b" stroke="#0d266b" stroke-width="22"/>
            <polygon points="58.3,21.7 75.3,57.4 99.1,45.5 83.8,74.4 92.3,101.6 58.3,82.9 24.3,105 34.5,76.1 17.5,52.3 43,52.3"
                     fill="#2b6bff" stroke="#2b6bff" stroke-width="16"/>
            <polygon points="58.7,31.9 71.7,59.2 89.9,50.1 78.2,72.2 84.7,93 58.7,78.7 32.7,95.6 40.5,73.5 27.5,55.3 47,55.3"
                     fill="#aac7ff" stroke="#aac7ff" stroke-width="10"/>
          </g>
          <ellipse cx="42" cy="50" rx="14" ry="6" fill="url(#faceShine)" transform="rotate(-12 42 50)"/>
          <ellipse cx="36" cy="74" rx="5" ry="2.8" fill="#ff8fb8" opacity="0.55" transform="rotate(-8 36 74)"/>
          <ellipse cx="84" cy="72" rx="4" ry="2.4" fill="#ff8fb8" opacity="0.5" transform="rotate(6 84 72)"/>
          <g>
            <ellipse cx="48" cy="60" rx="6.2" ry="7" fill="#0d266b"/>
            <circle cx="49.5" cy="58" r="1.7" fill="white"/>
          </g>
          <g>
            <ellipse cx="74" cy="63" rx="5.2" ry="6.2" fill="#0d266b"/>
            <circle cx="75.2" cy="61" r="1.5" fill="white"/>
          </g>
          <path d="M 52 74 Q 60 83 70 77" stroke="#0d266b" stroke-width="2.8" fill="none" stroke-linecap="round"/>
          <g fill="rgba(255,255,255,0.18)" stroke="#0d266b" stroke-width="2.4" stroke-linecap="round" filter="url(#wonky2)">
            <ellipse cx="48" cy="60" rx="11" ry="10.5" transform="rotate(-6 48 60)"/>
            <ellipse cx="74" cy="63" rx="9.5" ry="9" transform="rotate(4 74 63)"/>
            <path d="M 59 59 Q 62 56 66 61" fill="none"/>
            <path d="M 37 58 Q 32 56 28 55" fill="none"/>
            <path d="M 83.5 62 Q 88 60 91 59" fill="none"/>
            <path d="M 43 53 Q 46 50 51 54" stroke="white" stroke-width="1.4" opacity="0.7" fill="none"/>
            <path d="M 69 56 Q 72 53 76 56" stroke="white" stroke-width="1.2" opacity="0.65" fill="none"/>
          </g>
        </svg>
      </div>
    </div>

  </article>
  </div></div>
</body>
</html>
