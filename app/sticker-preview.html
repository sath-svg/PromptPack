<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Skilly Sticker Preview</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      html, body { margin: 0; padding: 0; background: #0a0a0c; color: #fafafa; font-family: system-ui, sans-serif; }
      header { padding: 24px; border-bottom: 1px solid rgba(255,255,255,0.08); }
      h1 { margin: 0 0 6px; font-size: 22px; }
      p { margin: 0; color: rgba(255,255,255,0.6); font-size: 13px; }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 24px;
        padding: 24px;
      }
      .card {
        background: #15151b;
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 14px;
        padding: 16px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }
      .stage {
        width: 200px; height: 200px;
        background: #0a0a0c;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow: visible;
      }
      .label {
        font-size: 13px;
        font-family: ui-monospace, Menlo, monospace;
        color: rgba(255,255,255,0.85);
      }
      .meta {
        font-size: 11px;
        color: rgba(255,255,255,0.45);
        text-align: center;
        font-family: ui-monospace, Menlo, monospace;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Skilly sticker preview</h1>
      <p>Live render of the 10 sticker variants. These are what the Playwright pipeline will record into WebMs.</p>
    </header>
    <div id="preview-root"></div>
    <script type="module" src="/src/sticker-preview.tsx"></script>
  </body>
</html>
