name: Build Skillset macOS

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/build-macos.yml"
  workflow_dispatch:

concurrency:
  group: build-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 45

    env:
      USE_BUN: "1"
      TAURI_BUNDLE_TARGETS: "dmg,app"
      # Apple code-signing intentionally OFF — set APPLE_* GH secrets and
      # re-add the env block to ship a signed/notarized build.
      #
      # Tauri updater signing (pubkey baked into binary, private key signs artifacts):
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js (fallback)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache cargo registry + git + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
          cache-on-failure: true

      - name: Cache bun + node modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            app/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('app/bun.lockb', 'app/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install JS dependencies (bun, fall back to npm)
        working-directory: app
        run: |
          set -euxo pipefail
          if [ "$USE_BUN" = "1" ] && command -v bun >/dev/null 2>&1; then
            bun install --frozen-lockfile
          else
            npm ci
          fi

      - name: Tauri build — Apple Silicon (native on aarch64 runner)
        working-directory: app
        run: |
          set -euxo pipefail
          # macos-latest is aarch64. No --target flag → cargo writes to
          # target/release/, which Tauri's bundler expects when --target
          # is omitted.
          if command -v bun >/dev/null 2>&1; then
            bun run tauri build
          else
            npm run tauri build
          fi

      - name: Collect artifacts
        run: |
          set -e
          mkdir -p artifacts
          for f in app/src-tauri/target/release/bundle/dmg/*.dmg; do
            [ -f "$f" ] && cp "$f" "artifacts/Skillset-AppleSilicon.dmg"
          done
          ls -la artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: skillset-macos-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
