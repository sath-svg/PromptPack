name: Build Skillset macOS

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/build-macos.yml"
  workflow_dispatch:

concurrency:
  group: build-macos-${{ github.ref }}
  cancel-in-progress: true

# Single universal build on macos-latest (Apple Silicon). Cargo builds both
# x86_64 and aarch64 targets, Tauri's bundler runs lipo to produce a fat
# binary, then wraps it in one .dmg that runs on both architectures. This
# replaces the previous two-runner setup that depended on the deprecated
# macos-13 Intel pool, which had long queue times.
jobs:
  build-universal:
    name: macOS Universal (Apple Silicon + Intel)
    runs-on: macos-latest
    timeout-minutes: 60

    env:
      USE_BUN: "1"
      TAURI_BUNDLE_TARGETS: "dmg,app"
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js (fallback)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Rust toolchain (both Apple targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo registry + git + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
          cache-on-failure: true
          key: universal

      - name: Cache bun + node modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            app/node_modules
          key: ${{ runner.os }}-universal-bun-${{ hashFiles('app/bun.lockb', 'app/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-universal-bun-

      - name: Install JS dependencies
        working-directory: app
        run: |
          set -euxo pipefail
          if [ "$USE_BUN" = "1" ] && command -v bun >/dev/null 2>&1; then
            bun install --frozen-lockfile
          else
            npm ci
          fi

      - name: Tauri build (universal-apple-darwin)
        working-directory: app
        run: |
          set -euxo pipefail
          # --target universal-apple-darwin tells Tauri to build x86_64 +
          # aarch64 and lipo them. Output lands at:
          #   src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          # Call CLI directly so `--target` reaches cargo (bun/npm script
          # indirection swallows the flag on some setups).
          npx --yes @tauri-apps/cli@latest build --target universal-apple-darwin

      - name: Collect artifact
        run: |
          set -e
          mkdir -p artifacts
          cp_one() { for f in $1; do [ -f "$f" ] && cp "$f" "$2" && return 0; done; return 0; }

          # Public-facing DMG (manual download, stable filename for /downloads page)
          for f in app/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg; do
            [ -f "$f" ] && cp "$f" "artifacts/Skillset-Universal.dmg"
          done

          # Updater bundle + signature (createUpdaterArtifacts:true → .app.tar.gz + .sig)
          cp_one "app/src-tauri/target/universal-apple-darwin/release/bundle/macos/Skillset.app.tar.gz"     "artifacts/"
          cp_one "app/src-tauri/target/universal-apple-darwin/release/bundle/macos/Skillset.app.tar.gz.sig" "artifacts/"

          ls -la artifacts/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: skillset-macos-universal-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
