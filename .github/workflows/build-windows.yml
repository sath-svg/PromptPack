name: Build Skillset Windows

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:
    inputs:
      build_target:
        description: "Target to build"
        type: choice
        default: "x64"
        options:
          - x64
          - arm64
          - all

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    env:
      USE_BUN: "1"
      # Ship both NSIS .exe (web installer) AND MSI (enterprise / Group Policy)
      TAURI_BUNDLE_TARGETS: "nsis,msi"
      # Windows code-signing intentionally OFF — secrets unset so Tauri ships
      # an unsigned EXE/MSI (SmartScreen warns on first launch).
      # To enable later: set WINDOWS_CERTIFICATE + WINDOWS_CERTIFICATE_PASSWORD
      # in GH secrets, then re-add the env block below.
      #
      # Tauri updater signing (pubkey baked into binary, private key signs artifacts):
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js (fallback)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc,aarch64-pc-windows-msvc

      - name: Cache cargo registry + git + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
          cache-on-failure: true

      - name: Cache bun + node modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            app/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('app/bun.lockb', 'app/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install JS dependencies (bun, fall back to npm)
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail
          if [ "$USE_BUN" = "1" ] && command -v bun >/dev/null 2>&1; then
            bun install --frozen-lockfile
          else
            npm ci
          fi

      # Defender real-time scanning frequently blocks WiX light.exe mid-link,
      # causing "failed to run light.exe" with no further info. Exclude the
      # Tauri WixTools cache + the build target dir before WiX runs.
      - name: Disable Defender realtime scan on WiX + target dirs
        shell: pwsh
        continue-on-error: true
        run: |
          Add-MpPreference -ExclusionPath "$env:LOCALAPPDATA\tauri" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath "${{ github.workspace }}\app\src-tauri\target" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionProcess "light.exe" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionProcess "candle.exe" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionProcess "signtool.exe" -ErrorAction SilentlyContinue
          Write-Host "Defender exclusions added (or silently skipped if unsupported)"

      - name: Resolve build target
        id: target
        shell: bash
        run: |
          set -e
          TARGET="${{ github.event.inputs.build_target }}"
          if [ -z "$TARGET" ]; then TARGET="x64"; fi
          echo "build_target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "Building target=$TARGET"

      - name: Tauri build — x64
        if: steps.target.outputs.build_target == 'x64' || steps.target.outputs.build_target == 'all'
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail
          # Call tauri CLI directly (not via `bun run <script>`) — bun
          # strips the `--` separator so `--target` never reaches cargo,
          # builds land in `target/release/` and the bundler then can't
          # find them (os error 2).
          npx --yes @tauri-apps/cli@latest build --target x86_64-pc-windows-msvc

      - name: Tauri build — ARM64
        if: steps.target.outputs.build_target == 'arm64' || steps.target.outputs.build_target == 'all'
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail
          npx --yes @tauri-apps/cli@latest build --target aarch64-pc-windows-msvc

      - name: Collect artifacts
        shell: bash
        run: |
          set -e
          mkdir -p artifacts
          # Helper: copy first match if exists.
          cp_one() { for f in $1; do [ -f "$f" ] && cp "$f" "$2" && return 0; done; return 0; }

          # x64 installers (versioned filename preserved as-is)
          cp_one "app/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/Skillset_*_x64-setup.exe"          "artifacts/"
          cp_one "app/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/Skillset_*_x64_en-US.msi"           "artifacts/"
          # x64 updater bundles + signatures (createUpdaterArtifacts:true)
          cp_one "app/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/Skillset_*_x64-setup.nsis.zip"     "artifacts/"
          cp_one "app/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/Skillset_*_x64-setup.nsis.zip.sig" "artifacts/"

          # ARM64 installers
          cp_one "app/src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/Skillset_*_arm64-setup.exe"        "artifacts/"
          cp_one "app/src-tauri/target/aarch64-pc-windows-msvc/release/bundle/msi/Skillset_*_arm64_en-US.msi"         "artifacts/"
          # ARM64 updater bundles + signatures
          cp_one "app/src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/Skillset_*_arm64-setup.nsis.zip"     "artifacts/"
          cp_one "app/src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/Skillset_*_arm64-setup.nsis.zip.sig" "artifacts/"

          ls -la artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: skillset-windows-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
