<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #07070a; }
  body { display: flex; align-items: flex-start; justify-content: flex-start; }

  /* .post is the exact OG frame. 600x315 CSS px -> rendered at 2x -> 1200x630. */
  .post {
    position: relative;
    width: 600px;
    height: 315px;
    overflow: hidden;
    background: #0a0a0c;
    color: #fafafa;
    font-family: 'Geist', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .glow {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse 52% 62% at 80% 40%, rgba(37,99,235,0.30), transparent 62%);
  }
  .grid {
    position: absolute; inset: 0; pointer-events: none; opacity: 0.5;
    background-image:
      linear-gradient(to right, rgba(255,255,255,0.035) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size: 44px 44px;
    -webkit-mask-image: radial-gradient(ellipse 90% 90% at 30% 50%, #000 30%, transparent 80%);
            mask-image: radial-gradient(ellipse 90% 90% at 30% 50%, #000 30%, transparent 80%);
  }

  .inner {
    position: relative; z-index: 2;
    height: 100%;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 34px 46px;
  }

  .brand { display: flex; align-items: center; gap: 9px; }
  .brand img { width: 26px; height: 26px; border-radius: 6px; object-fit: cover; display: block; }
  .brand span { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; color: #f4f4f5; }

  .headline { max-width: 360px; }
  .h-main {
    font-size: 38px; font-weight: 500; line-height: 1.12; letter-spacing: -0.03em; color: #fafafa;
  }
  .accent {
    margin-top: 7px;
    font-size: 38px; font-weight: 600; line-height: 1.12; letter-spacing: -0.03em; color: #7BA7FF;
  }
  .sub {
    margin-top: 18px; max-width: 360px;
    font-size: 15px; font-weight: 400; line-height: 1.5; color: #a1a1aa;
  }

  .foot { display: flex; align-items: center; gap: 8px; }
  .foot .dot { width: 6px; height: 6px; border-radius: 50%; background: #2563EB; }
  .foot span { font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.12em; color: #71717a; text-transform: uppercase; }

  .skilly {
    position: absolute; z-index: 1;
    right: -56px; top: 50%; transform: translateY(-50%) rotate(-4deg);
    width: 224px; height: 243px;
  }
  .skilly-glow {
    position: absolute; z-index: 0;
    right: -28px; top: 50%; transform: translateY(-50%);
    width: 210px; height: 210px; border-radius: 50%;
    background: radial-gradient(circle, rgba(37,99,235,0.42), transparent 65%);
    filter: blur(8px);
  }
</style>
</head>
<body>
  <div class="post">
    <div class="glow"></div>
    <div class="grid"></div>
    <div class="skilly-glow"></div>

    <svg class="skilly" viewBox="0 0 120 130" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" style="overflow:visible">
      <defs>
        <radialGradient id="og-outer" gradientUnits="userSpaceOnUse" cx="35" cy="30" r="110">
          <stop offset="0%" stop-color="#3658c2" /><stop offset="50%" stop-color="#0d266b" /><stop offset="100%" stop-color="#04143f" />
        </radialGradient>
        <radialGradient id="og-mid" gradientUnits="userSpaceOnUse" cx="35" cy="30" r="100">
          <stop offset="0%" stop-color="#82a8ff" /><stop offset="55%" stop-color="#2b6bff" /><stop offset="100%" stop-color="#143fb0" />
        </radialGradient>
        <radialGradient id="og-inner" gradientUnits="userSpaceOnUse" cx="40" cy="35" r="90">
          <stop offset="0%" stop-color="#ffffff" /><stop offset="35%" stop-color="#dde9ff" /><stop offset="70%" stop-color="#aac7ff" /><stop offset="100%" stop-color="#8aa9dd" />
        </radialGradient>
        <radialGradient id="og-shine" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="22">
          <stop offset="0%" stop-color="white" stop-opacity="0.95" /><stop offset="35%" stop-color="white" stop-opacity="0.45" /><stop offset="70%" stop-color="white" stop-opacity="0.20" /><stop offset="100%" stop-color="white" stop-opacity="0" />
        </radialGradient>
        <radialGradient id="og-cl" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="6">
          <stop offset="0%" stop-color="white" stop-opacity="1" /><stop offset="40%" stop-color="white" stop-opacity="0.85" /><stop offset="100%" stop-color="white" stop-opacity="0" />
        </radialGradient>
        <filter id="og-shadow" x="-25%" y="-25%" width="150%" height="150%">
          <feDropShadow dx="1.5" dy="3" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.55" />
        </filter>
        <filter id="og-wonky" x="-15%" y="-15%" width="130%" height="130%">
          <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="4" result="noise" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5" />
        </filter>
      </defs>
      <g stroke-linejoin="round" stroke-linecap="round" filter="url(#og-shadow)">
        <polygon points="58,14 78,56 106,42 88,76 98,108 58,86 18,112 30,78 10,50 40,50" fill="url(#og-outer)" stroke="#0d266b" stroke-width="22" />
        <polygon points="58.3,21.7 75.3,57.4 99.1,45.5 83.8,74.4 92.3,101.6 58.3,82.9 24.3,105 34.5,76.1 17.5,52.3 43,52.3" fill="url(#og-mid)" stroke="#2b6bff" stroke-width="16" />
        <polygon points="58.7,31.9 71.7,59.2 89.9,50.1 78.2,72.2 84.7,93 58.7,78.7 32.7,95.6 40.5,73.5 27.5,55.3 47,55.3" fill="url(#og-inner)" stroke="#aac7ff" stroke-width="10" />
      </g>
      <g transform="translate(60 60)">
        <ellipse cx="0" cy="0" rx="26" ry="20" fill="url(#og-shine)" />
        <ellipse cx="0" cy="0" rx="7" ry="5" fill="url(#og-cl)" />
      </g>
      <ellipse cx="36" cy="74" rx="5" ry="2.8" fill="#ff8fb8" opacity="0.55" transform="rotate(-8 36 74)" />
      <ellipse cx="84" cy="72" rx="4" ry="2.4" fill="#ff8fb8" opacity="0.5" transform="rotate(6 84 72)" />
      <g><ellipse cx="48" cy="60" rx="6.2" ry="7" fill="#0d266b" /><circle cx="49.5" cy="58" r="1.7" fill="white" /></g>
      <g><ellipse cx="74" cy="63" rx="5.2" ry="6.2" fill="#0d266b" /><circle cx="75.2" cy="61" r="1.5" fill="white" /></g>
      <path d="M 52 74 Q 60 83 70 77" stroke="#0d266b" stroke-width="2.8" fill="none" stroke-linecap="round" />
      <g fill="rgba(255,255,255,0.18)" stroke="#0d266b" stroke-width="2.4" stroke-linecap="round" filter="url(#og-wonky)">
        <ellipse cx="48" cy="60" rx="11" ry="10.5" transform="rotate(-6 48 60)" />
        <ellipse cx="74" cy="63" rx="9.5" ry="9" transform="rotate(4 74 63)" />
        <path d="M 59 59 Q 62 56 66 61" fill="none" />
        <path d="M 37 58 Q 32 56 28 55" fill="none" />
        <path d="M 83.5 62 Q 88 60 91 59" fill="none" />
        <path d="M 43 53 Q 46 50 51 54" stroke="white" stroke-width="1.4" opacity="0.7" fill="none" />
        <path d="M 69 56 Q 72 53 76 56" stroke="white" stroke-width="1.2" opacity="0.65" fill="none" />
      </g>
    </svg>

    <div class="inner">
      <div class="brand">
        <img src="web/public/img/skillset_logo.png" alt="" />
        <span>Skillset</span>
      </div>

      <div>
        <div class="headline">
          <div class="h-main">Teach AI the way you work.</div>
          <div class="accent">No code needed.</div>
        </div>
        <div class="sub">Describe what you do in plain words. Skillset builds the workflow that runs it for you.</div>
      </div>

      <div class="foot">
        <span class="dot"></span>
        <span>skillset.so</span>
      </div>
    </div>
  </div>
</body>
</html>
