name = "promptpack-api"
main = "src/index.ts"
compatibility_date = "2024-01-01"
account_id = "5d400bdfa16d6cb8aceff86d50d43650"
workers_dev = false
preview_urls = false

routes = [
  { pattern = "api.pmtpk.com", zone_name = "pmtpk.com", custom_domain = true },
  { pattern = "grok.pmtpk.com", zone_name = "pmtpk.com", custom_domain = true }
]

[vars]
ENVIRONMENT = "production"
CONVEX_URL = "https://determined-lark-313.convex.site"
ALLOWED_ORIGINS = "https://pmtpk.com, https://www.pmtpk.com, https://chatgpt.com, https://chat.openai.com, https://claude.ai, https://www.claude.ai, https://gemini.google.com, chrome-extension://*"
OLLAMA_URL = "https://ollama.pmtpk.com"
CLERK_ISSUER = "https://clerk.pmtpk.com"
CLERK_JWKS_URL = "https://clerk.pmtpk.com/.well-known/jwks.json"

# R2 bucket binding (production)
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "promptpack-files-prod"

# Required secrets (set via `wrangler secret put`, not in this file):
#   OPENROUTER_API_KEY        — used by /api/llm/chat managed-mode proxy
#   SKILLSET_INTERNAL_KEY     — shared secret with Convex /api/internal/credits/* endpoints
#   GROQ_API_KEY              — used by /api/enhance and /api/evaluate
#   MCP_TOKEN_SECRET          — used by /mcp long-lived token signing
#   CLERK_AUDIENCE            — Clerk JWT audience claim (optional)
